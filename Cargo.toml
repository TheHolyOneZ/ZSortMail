# SPDX-License-Identifier: GPL-3.0-or-later

[workspace]
resolver = "3"
members = [
  "src-tauri",
  "crates/zsm-core",
  "crates/zsm-mime",
  "crates/zsm-gmail",
  "crates/zsm-testkit",
  "crates/zsm-app",
  "crates/zsm-devserver",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://zsync.eu/zsortmail/"
rust-version = "1.90"
authors = ["ZSortMail contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
regex = "1"
zstd = "0.14"
html-escape = "0.3"
url = "2"
unicode-normalization = "0.1"
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
jiff = "1"
fastrand = "2"
# tauri-specta rc.29 pins specta to exactly rc.28.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }

[profile.dev]
# Keep dependency code reasonably fast in debug so SQLite and parsing don't distort perf checks.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
