name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows (NSIS and MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Show what was produced
        shell: pwsh
        run: |
          Get-ChildItem -Recurse target\release\bundle -Include *.exe,*.msi |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  macos-intel:
    name: macOS Intel (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-intel

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the dmg
        run: pnpm tauri build --bundles dmg --target x86_64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Show what was produced
        run: ls -lh target/x86_64-apple-darwin/release/bundle/dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  macos-silicon:
    name: macOS Apple silicon (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-silicon

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the dmg
        run: pnpm tauri build --bundles dmg --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Show what was produced
        run: ls -lh target/aarch64-apple-darwin/release/bundle/dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-silicon
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux (deb, rpm and AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file patchelf rpm libfuse2 \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm tauri build --bundles deb,rpm,appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Show what was produced
        run: |
          ls -lh target/release/bundle/deb/*.deb \
                 target/release/bundle/rpm/*.rpm \
                 target/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    needs: [windows, macos-intel, macos-silicon, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "number=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.number) }}
          name: ZSortMail v${{ steps.version.outputs.number }}
          draft: true
          prerelease: true
          files: out/*
          body: |
            Pre-release builds. They are not signed, so each system warns the first time.

            Windows: use the setup .exe (installs for you alone, no administrator) or the .msi. If SmartScreen says the publisher is unknown, press More info, then Run anyway.

            macOS: open the .dmg that matches your Mac (aarch64 for Apple silicon, x64 for Intel) and drag ZSortMail to Applications. If Gatekeeper refuses it, right-click the app and choose Open, or run `xattr -dr com.apple.quarantine /Applications/ZSortMail.app` once.

            Linux: the .deb is for Debian, Ubuntu and Mint, the .rpm for Fedora and openSUSE, and the .AppImage runs anywhere after `chmod +x`.

            SHA256SUMS.txt lists the checksum of every file.
