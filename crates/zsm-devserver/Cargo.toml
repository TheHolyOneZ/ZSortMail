[package]
name = "zsm-devserver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Development only: serves the real Rust backend over HTTP so the UI can run in a browser and under Playwright"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jiff = { workspace = true }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tauri = { version = "2", features = ["test"] }
zsortmail = { path = "../../src-tauri" }
zsm-app = { path = "../zsm-app" }
zsm-core = { path = "../zsm-core" }
zsm-testkit = { path = "../zsm-testkit" }
